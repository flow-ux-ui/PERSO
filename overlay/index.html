<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ayenyzer overlay</title>
<style>
  :root{
    --dmg:#e2493d;
    --heal:#6fae7a;
    --text:#e9e7e0;
    --muted:#9a9db0;
  }
  html,body{margin:0; height:100%; background:transparent; overflow:hidden;}
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); -webkit-user-select:none; user-select:none;}

  .card{
    position:relative;
    margin:8px;
    background:rgba(12,14,19,0.78);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    backdrop-filter:blur(2px);
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 16px);
    overflow:hidden;
  }

    .head {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: space-between;
        /* left padding gives "Ayenyzer" breathing room from the card edge;
           right padding keeps the Start/Stop button clear of the
           always-on-top drag-handle window floating over the card's
           top-right corner (HANDLE_SIZE 18 + HANDLE_MARGIN 6 in main.js) */
        padding:8px 26px 6px 14px;
        font-size: 11px;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--muted);
        flex: none;
    }
  .head .brand{color:var(--dmg); font-weight:700; flex:none;}
  .head .meta{
    font-family:'Consolas','Space Mono',monospace; font-size:10.5px;
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-align:right;
  }
  .dot{
    position:absolute;
    right:4px;
    bottom:4px;
    width:7px; height:7px;
    border-radius:50%;
    background:#565b6b;
  }
  .dot.interactive{background:#d1a24a;}

  .btn{
    -webkit-app-region:no-drag;
    cursor:pointer;
    font:inherit;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 9px;
    margin-left:8px;
    border-radius:5px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);
    color:var(--text);
    flex:none;
  }
  .btn:hover{background:rgba(255,255,255,0.14);}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn.running{color:var(--dmg); border-color:rgba(226,73,61,0.45);}

  .rows{padding:2px 10px 10px; overflow-y:auto; flex:1;}
  .row{margin:5px 0;}
  .row .top{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:2px;}
  .row .name{font-weight:600;}
  .row .val{font-family:'Consolas','Space Mono',monospace; color:var(--muted);}
  .bar-track{height:7px; border-radius:4px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}

  .empty{padding:14px 12px; font-size:11.5px; color:var(--muted); text-align:center;}
  .hint{padding:0 12px 10px; font-size:9.5px; color:var(--muted); text-align:center; opacity:.75;}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="brand">Ayenyzer</span>
      <span class="meta" id="meta">—</span>
      <button class="btn" id="mirrorBtn" title="Run wakfu-log-mirror.ps1">Start</button>
    </div>
    <div class="rows" id="rows">
      <div class="empty">Waiting for a fight… start Live mode in the config window.</div>
    </div>
    <span class="dot" id="modeDot" title="Ctrl+Shift+O to toggle click-through"></span>
  </div>

<script>
  const rowsEl = document.getElementById('rows');
  const metaEl = document.getElementById('meta');
  const modeDot = document.getElementById('modeDot');
  const mirrorBtn = document.getElementById('mirrorBtn');

  function renderMirrorBtn(running){
    mirrorBtn.textContent = running ? 'Stop' : 'Start';
    mirrorBtn.classList.toggle('running', running);
  }
  window.api.getMirrorStatus().then(s => renderMirrorBtn(s.running));
  window.api.onMirrorStatus((s) => renderMirrorBtn(s.running));

  mirrorBtn.addEventListener('click', async () => {
    mirrorBtn.disabled = true;
    try{
      if(mirrorBtn.classList.contains('running')){
        await window.api.stopMirror();
      }else{
        await window.api.startMirror();
        // Also kicks off Live mode in the config window (native file
        // picker to choose the mirrored log to watch), so Start alone
        // gets both the mirror script and Live mode running.
        window.api.requestStartWatching();
      }
    }finally{
      mirrorBtn.disabled = false;
    }
  });

  mirrorBtn.addEventListener('mouseenter', () => window.api.setOverlayHover(true));
  mirrorBtn.addEventListener('mouseleave', () => window.api.setOverlayHover(false));

  window.api.onOverlayMode((interactive) => {
    modeDot.classList.toggle('interactive', interactive);
    modeDot.title = interactive
      ? 'Interactive — drag/resize me. Ctrl+Shift+O to go click-through again.'
      : 'Click-through — Ctrl+Shift+O to make me interactive.';
  });

  window.api.onOverlayUpdate((data) => {
    if(!data || !data.entries || !data.entries.length){
      metaEl.textContent = '—';
      rowsEl.innerHTML = '<div class="empty">Waiting for a fight… start Live mode in the config window.</div>';
      return;
    }
    metaEl.textContent = (data.fightLabel ? data.fightLabel + ' · ' : '') + 'Turn ' + (data.turn || 1);
    const top = data.entries[0].dmg || 1;
    rowsEl.innerHTML = data.entries.map(c => {
      const pct = Math.max(2, Math.round((c.dmg / top) * 100));
      return `
        <div class="row">
          <div class="top">
            <span class="name" style="color:${c.color}">${escapeHtml(c.name)}</span>
            <span class="val">${c.dmg.toLocaleString()}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${c.color}"></div></div>
        </div>`;
    }).join('');
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
